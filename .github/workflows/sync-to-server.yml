name: Validate catalog and open sync PR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog
        run: ./tools/validate-catalog.sh

  # On every push to main, sync the snapshot into ecosystem-server and open
  # (or update) a PR there. The PR is the reminder that the catalog changed.
  # Requires the ECOSYSTEM_SERVER_TOKEN secret: a PAT with repo scope on
  # ecogenetic/ecosystem-server.
  open-sync-pr:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout catalog
        uses: actions/checkout@v4
        with:
          path: ecosystem-domain-catalog

      - name: Checkout ecosystem-server
        uses: actions/checkout@v4
        with:
          repository: ecogenetic/ecosystem-server
          token: ${{ secrets.ECOSYSTEM_SERVER_TOKEN }}
          path: ecosystem-server

      - name: Run sync script
        env:
          DOMAIN_CATALOG_PATH: ${{ github.workspace }}/ecosystem-domain-catalog
        run: ./ecosystem-server/scripts/sync-domain-catalog.sh

      - name: Open or update sync PR in ecosystem-server
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.ECOSYSTEM_SERVER_TOKEN }}
          path: ecosystem-server
          branch: chore/sync-domain-catalog
          commit-message: "Sync domain catalog snapshot to ${{ github.sha }}"
          title: "Sync domain catalog snapshot (${{ github.event.head_commit.message }})"
          body: |
            Automated sync from [ecosystem-domain-catalog@${{ github.sha }}](https://github.com/ecogenetic/ecosystem-domain-catalog/commit/${{ github.sha }}).

            > ${{ github.event.head_commit.message }}

            The catalog validator passed before this snapshot was produced.
            Review the diff under `src/main/resources/modeling/domains/` and merge to ship
            the updated domains with the next server build.
          add-paths: src/main/resources/modeling/domains
          delete-branch: true
