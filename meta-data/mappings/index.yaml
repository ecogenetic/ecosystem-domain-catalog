sources:
  - id: relational_db
    name: Generic Relational Database
    type: sql_table
    description: "SQL tables/views with standard primary keys and foreign keys"
    prefix: https://example.com/legacy/sql#
    links:
      - type: domain_mapping
        path: domains/{domainId}/mappings/generic-mapping.ttl

  - id: csv_export
    name: CSV Data Export
    type: flat_file
    description: "Comma-separated values with header rows"
    prefix: https://example.com/legacy/csv#
    links:
      - type: domain_mapping
        path: domains/{domainId}/mappings/generic-mapping.ttl

  - id: json_api
    name: REST/JSON API Payload
    type: web_api
    description: "JSON objects returned by modern APIs"
    prefix: https://example.com/legacy/json#
    links:
      - type: domain_mapping
        path: domains/{domainId}/mappings/generic-mapping.ttl

  - id: legacy_erp
    name: Legacy ERP/CRM System
    type: enterprise_system
    description: "Proprietary enterprise systems with custom schemas"
    prefix: https://example.com/legacy/erp#
    links:
      - type: domain_mapping
        path: domains/{domainId}/mappings/generic-mapping.ttl

industry_mapping_pattern: domains/{domainId}/industries/{industryId}/mappings/generic-mapping.ttl
